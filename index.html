<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir UMKM - Versi Github Pages</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-2">KASIR UMKM</h1>
        <p class="text-sm text-gray-600 mb-6">Versi HTML - Data kesimpen di HP lu</p>

        <div id="alert" class="hidden bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded mb-4"></div>

        <div class="bg-white p-6 rounded-lg shadow mb-6">
            <h2 class="text-xl font-bold mb-4">Tambah Produk</h2>
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3">
                <input type="text" id="kode" placeholder="Kode Barang" class="border p-2 rounded">
                <input type="text" id="nama" placeholder="Nama Produk" class="border p-2 rounded">
                <input type="number" id="harga" placeholder="Harga Jual" class="border p-2 rounded">
                <input type="number" id="stok" placeholder="Stok" class="border p-2 rounded">
                <button onclick="tambahProduk()" class="bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Simpan</button>
            </div>
        </div>

        <div class="bg-white p-6 rounded-lg shadow">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold">Daftar Produk</h2>
                <h3 class="text-lg font-bold">TOTAL: Rp <span id="totalHarga">0</span></h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="bg-gray-200">
                            <th class="p-3 text-left">Kode</th>
                            <th class="p-3 text-left">Nama</th>
                            <th class="p-3 text-left">Harga</th>
                            <th class="p-3 text-left">Stok</th>
                            <th class="p-3 text-left">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="tabelProduk"></tbody>
                </table>
            </div>
        </div>
        
        <p class="text-xs text-gray-500 mt-6 text-center">
            Dibuat pake HTML + Tailwind. Versi Laravel ada di repo ini, cek file lainnya.
        </p>
    </div>

<script>
let produk = JSON.parse(localStorage.getItem('produkKasir')) || [];

function showAlert(msg) {
    const alert = document.getElementById('alert');
    alert.textContent = msg;
    alert.classList.remove('hidden');
    setTimeout(() => alert.classList.add('hidden'), 2000);
}

function renderTabel() {
    const tbody = document.getElementById('tabelProduk');
    tbody.innerHTML = '';
    let total = 0;

    if (produk.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-3 text-center text-gray-500">Belum ada data produk</td></tr>`;
    } else {
        produk.forEach((p, i) => {
            total += p.harga * p.stok;
            tbody.innerHTML += `
                <tr class="border-b hover:bg-gray-50">
                    <td class="p-3">${p.kode}</td>
                    <td class="p-3">${p.nama}</td>
                    <td class="p-3">Rp ${p.harga.toLocaleString('id-ID')}</td>
                    <td class="p-3">${p.stok}</td>
                    <td class="p-3">
                        <button onclick="hapusProduk(${i})" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">Hapus</button>
                    </td>
                </tr>
            `;
        });
    }
    document.getElementById('totalHarga').textContent = total.toLocaleString('id-ID');
}

function tambahProduk() {
    const kode = document.getElementById('kode').value.trim();
    const nama = document.getElementById('nama').value.trim();
    const harga = parseInt(document.getElementById('harga').value);
    const stok = parseInt(document.getElementById('stok').value);

    if (!kode || !nama || !harga || !stok) {
        showAlert('Lengkapi semua data!');
        return;
    }
    if (produk.some(p => p.kode === kode)) {
        showAlert('Kode barang udah ada!');
        return;
    }

    produk.push({ kode, nama, harga, stok });
    localStorage.setItem('produkKasir', JSON.stringify(produk));
    
    document.getElementById('kode').value = '';
    document.getElementById('nama').value = '';
    document.getElementById('harga').value = '';
    document.getElementById('stok').value = '';
    
    showAlert('Produk berhasil ditambah!');
    renderTabel();
}

function hapusProduk(index) {
    if (confirm('Yakin hapus produk ini?')) {
        produk.splice(index, 1);
        localStorage.setItem('produkKasir', JSON.stringify(produk));
        showAlert('Produk dihapus!');
        renderTabel();
    }
}

// Jalanin pertama kali
renderTabel();
</script>
</body>
  </html>
